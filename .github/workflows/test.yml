name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tests -v
      - name: Initialize example state
        run: python -m jobtracker --state-dir "$RUNNER_TEMP/jobtracker-state" init --from-dir examples/state
      - name: Validate example state
        run: python -m jobtracker --state-dir "$RUNNER_TEMP/jobtracker-state" validate
