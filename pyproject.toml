[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "private-job-search-agent"
version = "0.1.0"
description = "Conservative, deduplicated job recommendation and application tracker"
requires-python = ">=3.11"

[project.scripts]
jobtracker = "jobtracker.cli:main"

[tool.setuptools]
packages = ["jobtracker"]
